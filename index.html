<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANA Call Assistant</title>
<style>
  :root {
    --blue-900: #0b2e5f;
    --blue-700: #12468f;
    --blue-600: #1a5cb0;
    --blue-100: #dbe9f9;
    --blue-50: #f0f6fd;
    --ink: #1c2733;
    --muted: #5b6b7c;
    --line: #d5e1ee;
    --panel: #ffffff;
    --field: #ffffff;
    --ok: #1e7d46;
    --warn: #a8680b;
    --bad: #b03a2e;
  }
  body.dark {
    --blue-900: #0a1930;
    --blue-700: #14335f;
    --blue-600: #2a6bb5;
    --blue-100: #24405f;
    --blue-50: #101f33;
    --ink: #dce7f3;
    --muted: #8fa3b8;
    --line: #2a4260;
    --panel: #0f2238;
    --field: #0b1a2c;
    --ok: #3ec97e;
    --warn: #e0a23e;
    --bad: #e06055;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Arial, sans-serif;
    background: #eef4fb url("assets/clouds.jpg") no-repeat center top / cover fixed;
    color: var(--ink);
    line-height: 1.55;
    transition: background .3s ease;
  }
  body.dark {
    background: #0a0f1c url("assets/stars.jpg") no-repeat center top / cover fixed;
  }
  header {
    background: linear-gradient(135deg, rgba(11,46,95,.94), rgba(26,92,176,.90));
    color: #fff;
    padding: 24px;
  }
  body.dark header {
    background: linear-gradient(135deg, rgba(6,14,30,.94), rgba(20,51,95,.90));
  }
  header .wrap { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  header .title-block { flex: 1; min-width: 0; }
  .controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .ctrl-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.14); color: #fff;
    border: 1px solid rgba(255,255,255,.4);
    font-size: 17px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,.28); }
  .ctrl-btn.lang { width: auto; min-width: 38px; padding: 0 9px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
  .ctrl-btn.active { background: #fff; color: var(--blue-700); border-color: #fff; }
  .logo-badge {
    background: #fff; border-radius: 10px; padding: 8px 14px;
    display: flex; align-items: center; flex-shrink: 0;
  }
  .logo-img { height: 46px; width: auto; display: block; }
  .logo-fallback {
    width: 44px; height: 44px; border-radius: 10px;
    background: #fff; color: var(--blue-700);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; letter-spacing: 1px;
  }
  header h1 { font-size: 22px; }
  header p { font-size: 13px; opacity: .9; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px 22px; box-shadow: 0 1px 3px rgba(11,46,95,.06);
  }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .sec-num {
    background: var(--blue-700); color: #fff; border-radius: 6px;
    font-size: 12px; font-weight: 700; padding: 2px 8px;
  }
  h2 { font-size: 18px; color: var(--blue-600); }
  body:not(.dark) h2 { color: var(--blue-900); }
  .sec-desc { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  label { font-size: 12px; font-weight: 600; color: var(--blue-600); text-transform: uppercase; letter-spacing: .04em; }
  body:not(.dark) label { color: var(--blue-700); }
  textarea, input[type="text"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit; font-size: 14px; color: var(--ink);
    resize: vertical; background: var(--field);
  }
  textarea:focus, input:focus { outline: 2px solid var(--blue-600); outline-offset: -1px; }
  button {
    background: var(--blue-600); color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--blue-700); }
  button.ghost { background: var(--panel); color: var(--blue-600); border: 1px solid var(--blue-600); }
  body:not(.dark) button.ghost { color: var(--blue-700); }
  button.ghost:hover { background: var(--blue-50); }
  .btn-row { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cards { display: grid; gap: 12px; }
  .card {
    border: 1px solid var(--line); border-left: 4px solid var(--blue-600);
    border-radius: 8px; padding: 12px 14px; background: var(--blue-50);
  }
  .card h3 { font-size: 14px; color: var(--blue-600); margin-bottom: 4px; display: inline; }
  body:not(.dark) .card h3 { color: var(--blue-900); }
  .card p { font-size: 13px; color: var(--ink); margin-top: 4px; }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .result {
    margin-top: 4px; border: 1px solid var(--blue-100); background: var(--blue-50);
    border-radius: 8px; padding: 14px 16px; font-size: 14px; white-space: pre-wrap; min-height: 60px;
  }
  .chip {
    display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px;
    padding: 3px 12px; color: #fff;
  }
  .chip.asas { background: var(--bad); }
  .chip.sederhana { background: var(--warn); }
  .chip.lancar { background: var(--ok); }
  .fix-box { margin-top: 8px; }
  .fix-box .note { font-size: 13px; color: var(--warn); margin-bottom: 4px; }
  .fix-box .better { font-size: 15px; color: var(--ok); font-weight: 600; }
  .fix-box .reason { font-size: 12px; color: var(--muted); }
  .two-col { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 760px) { .two-col { grid-template-columns: 1fr 1fr; } }
  footer { text-align: center; color: #f2f6fb; font-size: 12px; padding: 8px 0 24px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="logo-badge"><img class="logo-img" src="assets/ana-logo.png" alt="ANA"
         onerror="this.outerHTML='&lt;div class=&quot;logo-fallback&quot;&gt;ANA&lt;/div&gt;'"></span>
    <div class="title-block">
      <h1 id="app-title">ANA コールアシスタント</h1>
      <p id="app-desc"></p>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-theme" title="Light / Dark" aria-label="Light / Dark mode">🌙</button>
      <button class="ctrl-btn lang" data-lang="ms" title="Bahasa Melayu">MS</button>
      <button class="ctrl-btn lang" data-lang="en" title="English">EN</button>
      <button class="ctrl-btn lang active" data-lang="ja" title="日本語">JP</button>
    </div>
  </div>
</header>

<main>

  <!-- 1. Call Summary -->
  <section id="sec-summary">
    <div class="sec-head"><span class="sec-num">1</span><h2 id="sec1-title"></h2></div>
    <p class="sec-desc" id="sec1-desc"></p>

    <div class="cards" id="summary-examples"></div>

    <div class="two-col" style="margin-top:16px;">
      <div>
        <label for="call-input" id="lbl-call-input"></label>
        <textarea id="call-input" rows="7"></textarea>
        <div class="btn-row">
          <button id="btn-summary"></button>
          <button class="ghost" id="btn-summary-clear"></button>
        </div>
      </div>
      <div>
        <label id="lbl-summary"></label>
        <div class="result" id="summary-result" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- 2. Japanese Level -->
  <section id="sec-level">
    <div class="sec-head"><span class="sec-num">2</span><h2 id="sec2-title"></h2></div>
    <p class="sec-desc" id="sec2-desc"></p>

    <div class="cards" id="level-examples"></div>

    <div class="two-col" style="margin-top:16px;">
      <div>
        <label for="jp-input" id="lbl-jp-input"></label>
        <textarea id="jp-input" rows="4"></textarea>
        <div class="btn-row">
          <button id="btn-level"></button>
          <button class="ghost" id="btn-level-clear"></button>
        </div>
      </div>
      <div>
        <label id="lbl-level"></label>
        <div class="result" id="level-result" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- 3. Phrase Check -->
  <section id="sec-phrase">
    <div class="sec-head"><span class="sec-num">3</span><h2 id="sec3-title"></h2></div>
    <p class="sec-desc" id="sec3-desc"></p>

    <div class="cards" id="phrase-examples"></div>

    <div class="two-col" style="margin-top:16px;">
      <div>
        <label for="phrase-input" id="lbl-phrase-input"></label>
        <input type="text" id="phrase-input">
        <div class="btn-row">
          <button id="btn-phrase"></button>
          <button class="ghost" id="btn-phrase-clear"></button>
        </div>
      </div>
      <div>
        <label id="lbl-fix"></label>
        <div class="result" id="phrase-result" aria-live="polite"></div>
      </div>
    </div>
  </section>

</main>

<footer id="footer-text"></footer>

function chipClassOf(chip) {
  if (/asas|basic|初級/.test(chip)) return "asas";
  if (/sederhana|intermediate|中級/.test(chip)) return "sederhana";
  return "lancar";
}

/* ---------- Ciri 1: Rumuskan panggilan ---------- */

function summarizeCall(text) {
  var L = I18N[state.lang];
  var sentences = text.split(/(?:[。．!?！？]|\.\s+|\n)+/).map(function (s) {
    return s.trim().replace(/^[-•\s]+/, "");
  }).filter(function (s) { return s.length > 0; });
  if (sentences.length === 0) return "";

  var actions = [], issues = [], facts = [];
  sentences.forEach(function (s) {
    if (L.actionRe.test(s)) actions.push(s);
    else if (L.issueRe.test(s)) issues.push(s);
    else facts.push(s);
  });

  var out = L.sumTitle + "\n------------------\n";
  var caller = text.match(new RegExp(L.callerRe));
  if (caller) out += L.callerLabel + ": " + caller[1].trim() + "\n";
  out += L.mainPoints + " (" + sentences.length + " " + L.linesAnalyzed + "):\n";
  var mains = issues.length ? issues : facts;
  mains.slice(0, 3).forEach(function (s, i) { out += "  " + (i + 1) + ". " + s + "\n"; });
  if (actions.length) {
    out += L.agentActions + ":\n";
    actions.slice(0, 3).forEach(function (s) { out += "  – " + s + "\n"; });
  }
  var ticket = text.match(/(?:tiket|チケット|ticket|TKT|case)\s*[:#]?\s*([A-Za-z0-9\-]+)/i);
  if (ticket) out += L.refLabel + ": " + ticket[1] + "\n";
  out += L.statusLine;
  return out;
}

/* ---------- Ciri 2: Nilai tahap bahasa ---------- */

function estimateLevel(text) {
  var L = I18N[state.lang];
  if (!text.trim()) return "";
  var chars = text.length;
  var kanji = (text.match(/[\u4e00-\u9faf]/g) || []).length;
  var kanjiRatio = kanji / chars;
  var polite = /ございます|ください|いただけ|恐れ入ります|おそれいります|ませ/.test(text);
  var tech = /エラー|アップデート|再起動|ログ|接続|設定|コード|サーバー|パスワード|アカウント|予約/.test(text);
  var complex = /[、。]/.test(text) && chars >= 30;
  var casual = /ダメ|ちょっと|もう一回/.test(text);
  var short = chars <= 15;

  var score = 0;
  if (kanjiRatio > 0.25) score += 2; else if (kanjiRatio > 0.10) score += 1;
  if (polite) score += 2;
  if (tech) score += 1;
  if (complex) score += 1;
  if (casual) score -= 1;
  if (short) score -= 1;

  if (score <= 0) {
    return L.lvlBasic + "\n\n" + L.lvlBasicDesc + "\n" + L.lvlBasicTip +
      "\n\n" + L.agentPhrase + ": 「はい、大丈夫ですか。」「もう一度お願いします。」";
  } else if (score <= 3) {
    return L.lvlMid + "\n\n" + L.lvlMidDesc + "\n" + L.lvlMidTip +
      "\n\n" + L.agentPhrase + ": 「画面に「エラー」と表示されていますか。」";
  } else {
    return L.lvlHigh + "\n\n" + L.lvlHighDesc + "\n" + L.lvlHighTip +
      "\n\n" + L.agentPhrase + ": 「詳細を確認いたしますので、エラーコードをお知らせいただけますか。」";
  }
}

function correctPhrase(text) {
  var L = I18N[state.lang];
  if (!text.trim()) return "";
  var hits = L.rules.filter(function (r) { return r.test.test(text); });
  if (hits.length === 0) return L.phraseOk;
  var out = L.origPhrase + ": " + text + "\n\n";
  hits.slice(0, 3).forEach(function (r, i) {
    out += L.problemN + " " + (i + 1) + ": " + r.note + "\n";
    out += L.fixLabel + ": " + r.better + "\n";
    out += L.reasonLabel + ": " + r.reason + "\n\n";
  });
  out += L.useFix;
  return out;
}

document.getElementById("btn-phrase").addEventListener("click", function () {
  var text = document.getElementById("phrase-input").value.trim();
  var res = document.getElementById("phrase-result");
  if (!text) { res.textContent = I18N[state.lang].needPhrase; return; }
  res.textContent = correctPhrase(text);
});
document.getElementById("btn-phrase-clear").addEventListener("click", function () {
  document.getElementById("phrase-input").value = "";
  document.getElementById("phrase-result").textContent = "";
});

/* ---------- Theme: light / dark ---------- */

document.getElementById("btn-theme").addEventListener("click", function () {
  state.dark = !state.dark;
  document.body.classList.toggle("dark", state.dark);
  this.textContent = state.dark ? "☀️" : "🌙";
});

/* ---------- Language switching ---------- */

function applyLanguage() {
  applyStaticTexts();
  renderSummaries();
  renderLevels();
  renderPhrases();
  // Re-render demo results in the new language (inputs are never preserved)
  document.getElementById("summary-result").textContent = I18N[state.lang].demoSummary;
  document.getElementById("level-result").textContent =
    estimateLevel("予約しようとしたら、画面がエラーになって先に進めませんでした。");
  document.getElementById("phrase-result").textContent =
    correctPhrase("お客様、ちょっと待ってください。");
  document.querySelectorAll(".ctrl-btn.lang").forEach(function (b) {
    b.classList.toggle("active", b.dataset.lang === state.lang);
  });
}

document.querySelectorAll(".ctrl-btn.lang").forEach(function (b) {
  b.addEventListener("click", function () {
    state.lang = this.dataset.lang;
    applyLanguage();
  });
});

/* ---------- Inisialisasi ---------- */
applyLanguage();
</script>
</body>
</html>
